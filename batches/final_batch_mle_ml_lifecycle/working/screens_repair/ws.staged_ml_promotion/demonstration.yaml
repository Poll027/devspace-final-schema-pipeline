availableSecrets:
  secretManager:
  - env: PROMOTION_TOKEN
    versionName: projects/fixture-project/secrets/promotion-token/versions/1
serviceAccount: projects/fixture-project/serviceAccounts/fixture-build@fixture-project.iam.gserviceaccount.com
steps:
- args:
  - python
  - demonstration_entry.py
  - ${_CASE}
  - compatibility
  id: compatibility
  name: python:3.11
  waitFor:
  - '-'
- args:
  - python
  - demonstration_entry.py
  - ${_CASE}
  - staging_quality
  id: staging_quality
  name: python:3.11
  waitFor:
  - compatibility
- args:
  - python
  - demonstration_entry.py
  - ${_CASE}
  - authorization
  id: authorization
  name: python:3.11
  waitFor:
  - staging_quality
- args:
  - python
  - downstream_entry.py
  - ${_ARTIFACT}
  id: production
  name: python:3.11
  secretEnv:
  - PROMOTION_TOKEN
  waitFor:
  - authorization
substitutions:
  _ARTIFACT: A
  _CASE: accepted
  _SNAPSHOT: valid
